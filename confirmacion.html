<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Confirmación de Compra</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .confirmation-container {
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    .confirmation-container h1 {
      color: #28a745;
      font-size: 2em;
      margin-bottom: 10px;
    }

    .confirmation-container p {
      font-size: 1.1em;
      color: #333;
      margin-bottom: 30px;
    }

    .btn-home {
      background-color: #007bff;
      color: #fff;
      padding: 12px 24px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .btn-home:hover {
      background-color: #0056b3;
    }

    .icon {
      font-size: 3em;
      color: #28a745;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="confirmation-container">
    <div class="icon">✅</div>
    <h1>¡Compra exitosa!</h1>
    <p>Tu pedido está siendo procesado. Recibirás un correo con los detalles.</p>
    <a class="btn-home" href="index.html">Volver al inicio</a>
  </div>
</body>
</html>
